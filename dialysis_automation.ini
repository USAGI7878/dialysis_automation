README = """
# Dialysis Data Automation System
# 透析数据自动化系统

## 功能 Features
- 📄 OCR识别护理记录纸 / OCR recognition of nursing records
- 📱 OCR识别透析机屏幕 / OCR recognition of dialysis machine
- 🤖 自动填入Origin系统 / Automatic data entry to Origin
- 💾 数据导入导出 / Data import/export

## 安装步骤 Installation

### 1. 创建虚拟环境 Create Virtual Environment
```bash
python -m venv venv
```

### 2. 激活虚拟环境 Activate Virtual Environment
Windows:
```bash
venv\\Scripts\\activate
```

Linux/Mac:
```bash
source venv/bin/activate
```

### 3. 安装依赖 Install Dependencies
```bash
pip install -r requirements.txt
```

### 4. 配置设置 Configure Settings
编辑 `config.json` 文件，填入Origin系统的URL和字段映射。

## 使用方法 Usage

### 启动程序 Start Application
```bash
python main.py
```

### 工作流程 Workflow
1. **Step 1**: 上传护理记录纸照片 Upload nursing record photo
2. **Step 2**: OCR识别并验证数据 OCR recognition and verify data
3. **Step 3**: 上传透析机照片 Upload dialysis machine photo
4. **Step 4**: 提取每小时观察记录 Extract hourly observations
5. **Step 5**: 填入Origin登录信息 Enter Origin credentials
6. **Step 6**: 自动填入数据 Automatic data entry

## 注意事项 Notes
- 确保在医院网络环境中运行 Must run on hospital network
- 首次使用建议手动验证数据 Verify data manually on first use
- 定期备份导出的JSON文件 Regularly backup exported JSON files

## 故障排查 Troubleshooting

### OCR识别不准确 OCR Inaccurate
- 确保照片清晰，光线充足 Ensure clear photos with good lighting
- 调整图片对比度 Adjust image contrast
- 手动修正识别结果 Manually correct results

### Origin自动化失败 Automation Failed
- 检查网络连接 Check network connection
- 验证登录凭据 Verify credentials
- 查看logs文件夹中的日志 Check logs folder

## 技术支持 Support
Contact: [Your Contact Info]
"""

